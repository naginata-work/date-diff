<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Date Difference Calculator / 日付差分計算機</title>
<meta name="description" content="2つの日付の間が何年何ヶ月何日か、合計日数・週数もまとめて計算します。">
<script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-4214020669195548"
     crossorigin="anonymous"></script>
<style>
  :root {
    --bg: #101418; --card: #1a2028; --text: #f0f3f6; --sub: #8b96a3;
    --accent: #38bdf8; --accent2: #fb923c; --border: #232b34;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; font-family: "Hiragino Kaku Gothic ProN", "Segoe UI", Arial, sans-serif;
    background: var(--bg); color: var(--text); padding: 16px;
  }
  .wrap { max-width: 460px; margin: 0 auto; }
  .top-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 4px; }
  .home-link { font-size: 22px; text-decoration: none; line-height: 1; }
  .lang-btn { background: none; border: 1px solid var(--border); color: var(--sub); border-radius: 6px; padding: 4px 10px; font-size: 12px; cursor: pointer; }
  h1 { font-size: 21px; text-align: center; margin: 4px 0 4px; }
  .lead { text-align: center; color: var(--sub); font-size: 13px; margin-bottom: 18px; line-height: 1.6; }
  .card { background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 16px; margin-bottom: 14px; }
  label { display: block; font-size: 13px; color: var(--sub); margin-bottom: 4px; }
  input[type="date"] { width: 100%; padding: 10px; font-size: 15px; border: 1px solid var(--border); border-radius: 8px; background: #10151b; color: var(--text); }
  .field { margin-bottom: 12px; }
  .big-result { font-size: 26px; font-weight: bold; color: var(--accent); text-align: center; margin: 10px 0 6px; }
  .sub-stats { font-size: 13px; color: var(--sub); text-align: center; line-height: 1.9; }
  .copy-btn { width: 100%; padding: 11px; border: 1px solid var(--border); border-radius: 10px; font-size: 13.5px; cursor: pointer; background: none; color: var(--text); margin-top: 12px; }
  .footer-links { text-align: center; font-size: 12px; color: var(--sub); margin-top: 4px; line-height: 1.8; }
  .footer-links a { color: var(--accent2); text-decoration: none; }
</style>
</head>
<body>
<div class="wrap">
  <div class="top-row"><a href="https://naginata-work.github.io/" class="home-link" title="All tools">🧰</a><button class="lang-btn" id="langBtn">EN</button></div>
  <h1 id="title">📅 日付差分計算機</h1>
  <p class="lead" id="lead">2つの日付の間が何年何ヶ月何日か、まとめて計算します。</p>

  <div class="card">
    <div class="field">
      <label id="date1Label">日付1</label>
      <input type="date" id="date1">
    </div>
    <div class="field">
      <label id="date2Label">日付2</label>
      <input type="date" id="date2">
    </div>

    <div class="big-result" id="bigResult">-</div>
    <div class="sub-stats" id="subStats"></div>
    <button class="copy-btn" id="copyBtn"></button>
  </div>

  <div class="card" style="font-size:13px; line-height:1.9; color:var(--sub);">
    <h2 id="aboutTitle" style="font-size:15px; color:var(--text); margin:0 0 8px;"></h2>
    <p id="aboutBody1" style="margin:0 0 10px;"></p>
    <p id="aboutBody2" style="margin:0;"></p>
  </div>

  <div class="card" style="font-size:13px; line-height:1.9; color:var(--sub);">
    <h2 id="faqTitle" style="font-size:15px; color:var(--text); margin:0 0 10px;"></h2>
    <p id="faq1Q" style="margin:0 0 4px; color:var(--text); font-weight:bold;"></p>
    <p id="faq1A" style="margin:0 0 12px;"></p>
    <p id="faq2Q" style="margin:0 0 4px; color:var(--text); font-weight:bold;"></p>
    <p id="faq2A" style="margin:0;"></p>
  </div>

  <p class="footer-links" id="footerLinks"></p>
  <p style="text-align:center; font-size:11px; color:var(--sub); margin-top:4px;">
    <a href="https://naginata-work.github.io/" style="color:var(--sub);" id="allToolsLink"></a> ・
    <a href="https://naginata-work.github.io/privacy.html" style="color:var(--sub);" id="privacyLink"></a>
  </p>
</div>

<script>
  const I18N = {
    ja: {
      title: '📅 日付差分計算機',
      lead: '2つの日付の間が何年何ヶ月何日か、まとめて計算します。',
      date1Label: '日付1',
      date2Label: '日付2',
      bigResult: (y, m, d) => `${y}年${m}ヶ月${d}日`,
      totalDaysLabel: n => `合計 ${n.toLocaleString()} 日`,
      totalWeeksLabel: n => `約 ${n.toLocaleString()} 週間`,
      copyBtn: '結果をコピー',
      copied: 'コピーしました!',
      needDates: '両方の日付を入力してください',
      footerLinks: '他のツールも作っています → <a href="https://naginata-work.github.io/countdown/" target="_blank" rel="noopener">カウントダウン</a> / <a href="https://naginata-work.github.io/percent-calc/" target="_blank" rel="noopener">パーセント計算機</a>',
      aboutTitle: 'カウントダウンとの違い',
      aboutBody1: '「入社して何年何ヶ月になるか」「契約開始日から何日経ったか」など、未来の予定ではなく過去や任意の2つの日付の間を知りたい場面もあります。このツールはcountdown(未来のイベントをリアルタイムで数え続けるツール)とは違い、任意の2つの日付を一度だけ正確に計算する用途です。',
      aboutBody2: '2つの日付を入力すると、年・月・日の正確な内訳と、合計日数・週数がまとめて表示されます。月の途中をまたぐ場合や、うるう年をまたぐ場合でも、実際のカレンダーに基づいて正確に計算します。',
      faqTitle: 'よくある質問',
      faq1Q: 'なぜ単純に「日数÷365」で年数を出さないの?',
      faq1A: 'うるう年や月ごとの日数の違い(28〜31日)があるため、単純な割り算では実際の年月日とずれてしまいます。このツールはカレンダー通りに月を1つずつ数えて計算しているため、正確な年月日が得られます。',
      faq2Q: '日付1と日付2はどちらが先でもいい?',
      faq2A: 'はい。前後どちらの順番で入力しても、内部で自動的に古い方・新しい方を判定して計算するため、結果は変わりません。',
    },
    en: {
      title: '📅 Date Difference Calculator',
      lead: 'Find exactly how many years, months, and days are between two dates.',
      date1Label: 'Date 1',
      date2Label: 'Date 2',
      bigResult: (y, m, d) => `${y}y ${m}m ${d}d`,
      totalDaysLabel: n => `${n.toLocaleString()} days total`,
      totalWeeksLabel: n => `about ${n.toLocaleString()} weeks`,
      copyBtn: 'Copy result',
      copied: 'Copied!',
      needDates: 'Please choose both dates',
      footerLinks: 'Also made these → <a href="https://naginata-work.github.io/countdown/" target="_blank" rel="noopener">Countdown Timer</a> / <a href="https://naginata-work.github.io/percent-calc/" target="_blank" rel="noopener">Percentage Calculator</a>',
      aboutTitle: 'How this differs from the Countdown Timer',
      aboutBody1: "Sometimes you need the gap between two dates that aren't a future event — how long you've worked somewhere, or how many days since a contract started. Unlike the Countdown Timer, which live-counts down to one future date, this tool does a one-time, precise calculation between any two dates you choose.",
      aboutBody2: "Enter two dates and get an exact years/months/days breakdown, plus the total days and weeks. It correctly handles month-end edge cases and leap years by counting through the actual calendar rather than dividing by an average.",
      faqTitle: 'FAQ',
      faq1Q: "Why not just divide total days by 365 to get the year count?",
      faq1A: "Because leap years and months of different lengths (28 to 31 days) throw that off. This tool steps through the calendar month by month instead, so the years/months/days breakdown stays accurate.",
      faq2Q: 'Does it matter which date goes in Date 1 vs. Date 2?',
      faq2A: "No — the tool automatically figures out which date is earlier internally, so the result is the same either way.",
    }
  };

  function loadLang() { try { return localStorage.getItem('dateDiffLang'); } catch (e) { return null; } }
  function saveLang(l) { try { localStorage.setItem('dateDiffLang', l); } catch (e) {} }
  let lang = loadLang() === 'en' ? 'en' : 'ja';
  function t() { return I18N[lang]; }

  function daysInMonth(year, month1to12) {
    return new Date(year, month1to12, 0).getDate();
  }

  function addMonths(d, m) {
    let month = d.getMonth() + m;
    const year = d.getFullYear() + Math.floor(month / 12);
    month = ((month % 12) + 12) % 12;
    const day = Math.min(d.getDate(), daysInMonth(year, month + 1));
    return new Date(year, month, day);
  }

  function ymdDiff(d1, d2) {
    if (d1 > d2) { const tmp = d1; d1 = d2; d2 = tmp; }
    let totalMonths = (d2.getFullYear() - d1.getFullYear()) * 12 + (d2.getMonth() - d1.getMonth());
    let anchor = addMonths(d1, totalMonths);
    while (anchor > d2) {
      totalMonths--;
      anchor = addMonths(d1, totalMonths);
    }
    const days = Math.round((d2 - anchor) / 86400000);
    const years = Math.floor(totalMonths / 12);
    const months = totalMonths % 12;
    const totalDays = Math.round((d2 - d1) / 86400000);
    return { years, months, days, totalDays };
  }

  let lastResult = null;

  function calc() {
    const v1 = document.getElementById('date1').value;
    const v2 = document.getElementById('date2').value;
    if (!v1 || !v2) {
      document.getElementById('bigResult').textContent = '-';
      document.getElementById('subStats').textContent = '';
      return;
    }
    const d1 = new Date(v1 + 'T00:00:00');
    const d2 = new Date(v2 + 'T00:00:00');
    const r = ymdDiff(d1, d2);
    lastResult = r;
    document.getElementById('bigResult').textContent = t().bigResult(r.years, r.months, r.days);
    document.getElementById('subStats').innerHTML =
      t().totalDaysLabel(r.totalDays) + '<br>' + t().totalWeeksLabel(Math.round(r.totalDays / 7));
  }

  document.getElementById('date1').addEventListener('input', calc);
  document.getElementById('date2').addEventListener('input', calc);

  document.getElementById('copyBtn').addEventListener('click', async () => {
    if (!lastResult) { alert(t().needDates); return; }
    const text = t().bigResult(lastResult.years, lastResult.months, lastResult.days) + ' / ' +
      t().totalDaysLabel(lastResult.totalDays) + ' ' + location.href;
    try {
      await navigator.clipboard.writeText(text);
      const btn = document.getElementById('copyBtn');
      const original = btn.textContent;
      btn.textContent = t().copied;
      setTimeout(() => { btn.textContent = original; }, 1500);
    } catch { alert(text); }
  });

  function renderStaticText() {
    document.getElementById('title').textContent = t().title;
    document.getElementById('lead').textContent = t().lead;
    document.getElementById('date1Label').textContent = t().date1Label;
    document.getElementById('date2Label').textContent = t().date2Label;
    document.getElementById('copyBtn').textContent = t().copyBtn;
    document.getElementById('footerLinks').innerHTML = t().footerLinks;
    document.getElementById('aboutTitle').textContent = t().aboutTitle;
    document.getElementById('aboutBody1').textContent = t().aboutBody1;
    document.getElementById('aboutBody2').textContent = t().aboutBody2;
    document.getElementById('faqTitle').textContent = t().faqTitle;
    document.getElementById('faq1Q').textContent = t().faq1Q;
    document.getElementById('faq1A').textContent = t().faq1A;
    document.getElementById('faq2Q').textContent = t().faq2Q;
    document.getElementById('faq2A').textContent = t().faq2A;
    document.getElementById('allToolsLink').textContent = lang === 'ja' ? '他のツール一覧' : 'All tools';
    document.getElementById('allToolsLink').href = 'https://naginata-work.github.io/';
    document.getElementById('privacyLink').textContent = lang === 'ja' ? 'プライバシーポリシー' : 'Privacy policy';
    document.getElementById('privacyLink').href = 'https://naginata-work.github.io/privacy.html';
    calc();
  }

  document.getElementById('langBtn').addEventListener('click', () => {
    lang = lang === 'ja' ? 'en' : 'ja';
    saveLang(lang);
    document.getElementById('langBtn').textContent = lang === 'ja' ? 'EN' : 'JA';
    renderStaticText();
  });

  document.getElementById('langBtn').textContent = lang === 'ja' ? 'EN' : 'JA';
  const today = new Date().toISOString().slice(0, 10);
  document.getElementById('date2').value = today;
  renderStaticText();
</script>
</body>
</html>
